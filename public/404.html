<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>페이지를 찾을 수 없습니다 · BuildStory AI</title>
  <meta name="theme-color" content="#07111f">
  <style>
    :root{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f6fbff;background:#07111f}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 25% 15%,#173360,#07111f 50%)}main{width:min(620px,100%);padding:42px;border:1px solid #263650;border-radius:22px;background:#0b1727;box-shadow:0 30px 80px #0008}span{color:#74e6c3;font:800 12px ui-monospace,monospace}h1{font-size:clamp(36px,8vw,62px);line-height:1;margin:12px 0 20px;letter-spacing:-.055em}p{color:#9dafc5;line-height:1.7}div{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap}a,button{min-height:44px;border-radius:10px;padding:0 16px;display:inline-flex;align-items:center;border:1px solid #31425b;background:#fff;color:#07111f;text-decoration:none;font:700 14px inherit;cursor:pointer}button{background:transparent;color:#fff}@media(max-width:430px){main{padding:28px}a,button{width:100%;justify-content:center}}</style>
</head>
<body><main><span>404 / STORY NOT FOUND</span><h1>이 페이지의<br>커밋을 찾지 못했습니다.</h1><p>주소가 바뀌었거나 존재하지 않는 경로입니다. BuildStory 홈으로 돌아가 저장소를 다시 분석할 수 있습니다.</p><div><a id="home" href="/">홈으로 이동</a><button type="button" onclick="history.back()">이전 페이지</button></div></main><script>const p=location.pathname.split('/').filter(Boolean);const b=location.hostname.endsWith('github.io')&&p.length?'/'+p[0]+'/':'/';document.getElementById('home').href=b;</script></body>
</html>
